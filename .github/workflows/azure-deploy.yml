name: Deploy to Azure Web App

on:
  push:
    branches:
      - main # Change to your default branch name if it is not main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download your source code from GitHub
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: Deploy directly to Azure Web App using the Publish Profile secret
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'StudentResultApp'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          # package: '.' # Keeps default root deployment. Change if your build outputs to a subfolder like 'dist' or 'build'
